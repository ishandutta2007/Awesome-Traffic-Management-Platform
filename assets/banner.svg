<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2980" />
      <stop offset="100%" stop-color="#26D0CE" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bgGradient)" rx="15" ry="15"/>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">Awesome Traffic Management Platform</text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="20" fill="#E0E0E0" text-anchor="middle">Intelligent Transportation Systems &amp; Smart City Mobility</text>
  <circle cx="-50" cy="160" r="10" fill="#FFD700">
    <animate attributeName="cx" from="-50" to="850" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="180" r="10" fill="#FF5722">
    <animate attributeName="cx" from="850" to="-50" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
